name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper when absent
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name drug_edu --org com.mustafagfx97
            rm -f test/widget_test.dart
          fi

      - name: Normalize Android identity
        run: |
          sed -i 's/android:label="drug_edu"/android:label="Drug Edu"/' android/app/src/main/AndroidManifest.xml

      - name: Upload generated Android wrapper
        uses: actions/upload-artifact@v4
        with:
          name: drug-edu-generated-android-wrapper
          path: android
          include-hidden-files: true
          if-no-files-found: error

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: drug-edu-v1-preview-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
