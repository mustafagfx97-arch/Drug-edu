name: drug_edu
description: Evidence-based supplement decision support and patient counseling for clinical pharmacists.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
