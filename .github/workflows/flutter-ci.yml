name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name drug_edu --org com.mustafagfx97
          rm -f test/widget_test.dart
          sed -i 's/android:label="drug_edu"/android:label="Drug Edu"/' android/app/src/main/AndroidManifest.xml

      - name: Verify Android identity
        run: |
          grep -F 'namespace = "com.mustafagfx97.drug_edu"' android/app/build.gradle.kts
          grep -F 'applicationId = "com.mustafagfx97.drug_edu"' android/app/build.gradle.kts
          grep -F 'android:label="Drug Edu"' android/app/src/main/AndroidManifest.xml

      - name: Configure production signing when secrets are present
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Record signing status
        run: |
          mkdir -p build
          if [ -f android/key.properties ]; then
            echo "PRODUCTION_SIGNED=true" | tee build/release-signing-status.txt
          else
            {
              echo "PRODUCTION_SIGNED=false"
              echo "This CI artifact uses the Flutter template fallback signing and is NOT for Google Play upload."
              echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for production signing."
            } | tee build/release-signing-status.txt
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Validate PWA source assets
        run: |
          test -f lib/main_iv.dart
          test -f web/index.html
          test -f web/manifest.json
          test -f web/sw.js
          test -f web/icons/Icon-192.png
          test -f web/icons/Icon-512.png
          python3 -c "import json; x=json.load(open('web/manifest.json')); assert x['display']=='standalone'; assert len(x['icons'])>=2"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build installable PWA web release
        run: flutter build web --release -t lib/main_iv.dart --base-href "/Drug-edu/" --pwa-strategy=none

      - name: Validate generated PWA release
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/manifest.json
          test -s build/web/sw.js
          test -s build/web/icons/Icon-192.png
          test -s build/web/icons/Icon-512.png
          grep -F '/Drug-edu/' build/web/index.html

      - name: Upload installable PWA web release
        uses: actions/upload-artifact@v4
        with:
          name: drug-edu-pwa-web-release
          path: build/web/
          if-no-files-found: error

