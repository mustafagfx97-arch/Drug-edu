name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name drug_edu --org com.mustafagfx97
          rm -f test/widget_test.dart
          sed -i 's/android:label="drug_edu"/android:label="Drug Edu"/' android/app/src/main/AndroidManifest.xml

      - name: Verify Android identity
        run: |
          grep -F 'namespace = "com.mustafagfx97.drug_edu"' android/app/build.gradle.kts
          grep -F 'applicationId = "com.mustafagfx97.drug_edu"' android/app/build.gradle.kts
          grep -F 'android:label="Drug Edu"' android/app/src/main/AndroidManifest.xml

      - name: Configure production signing when secrets are present
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Record signing status
        run: |
          mkdir -p build
          if [ -f android/key.properties ]; then
            echo "PRODUCTION_SIGNED=true" | tee build/release-signing-status.txt
          else
            {
              echo "PRODUCTION_SIGNED=false"
              echo "This CI artifact uses the Flutter template fallback signing and is NOT for Google Play upload."
              echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for production signing."
            } | tee build/release-signing-status.txt
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Android release AAB
        run: flutter build appbundle --release

      - name: Configure standalone Patient Edu Android identity
        run: |
          sed -i 's/namespace = "com.mustafagfx97.drug_edu"/namespace = "com.mustafagfx97.patient_edu"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.mustafagfx97.drug_edu"/applicationId = "com.mustafagfx97.patient_edu"/' android/app/build.gradle.kts
          sed -i 's/android:label="Drug Edu"/android:label="Patient Edu"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/package com.mustafagfx97.drug_edu/package com.mustafagfx97.patient_edu/' android/app/src/main/kotlin/com/mustafagfx97/drug_edu/MainActivity.kt
          grep -F 'namespace = "com.mustafagfx97.patient_edu"' android/app/build.gradle.kts
          grep -F 'applicationId = "com.mustafagfx97.patient_edu"' android/app/build.gradle.kts
          grep -F 'package com.mustafagfx97.patient_edu' android/app/src/main/kotlin/com/mustafagfx97/drug_edu/MainActivity.kt
          grep -F 'android:label="Patient Edu"' android/app/src/main/AndroidManifest.xml

      - name: Build standalone Patient Edu debug APK
        run: |
          flutter build apk --debug -t lib/main_patient_edu.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/patient-edu-debug.apk

      - name: Build standalone Patient Edu release APK
        run: |
          flutter build apk --release -t lib/main_patient_edu.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/patient-edu-release.apk

      - name: Upload standalone Patient Edu APKs
        uses: actions/upload-artifact@v4
        with:
          name: patient-edu-standalone-apks
          path: |
            build/patient-edu-debug.apk
            build/patient-edu-release.apk
          if-no-files-found: error

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drug-edu-v1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: drug-edu-v1-release-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-signing-status.txt
          if-no-files-found: error
